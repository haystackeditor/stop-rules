[build]
  command = "npm run build:server"
  publish = "public"

# The Deploy to Netlify button turns these placeholders into labelled prompts.
[template.environment]
  STOP_RULES_CLOUDFLARE_ACCOUNT_ID = "the Cloudflare account Clef runs on, 32 hex characters"
  STOP_RULES_CLOUDFLARE_API_TOKEN = "a Cloudflare API token for that account with the Workers AI permission, which stays on this server"
  STOP_RULES_TOKEN = "the token your developers' hooks will send, from openssl rand -hex 24"
  OPENAI_API_KEY = "your OpenAI API key, needed only if your repos use the openai judge"
