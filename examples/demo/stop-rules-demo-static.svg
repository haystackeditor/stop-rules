<svg xmlns="http://www.w3.org/2000/svg" width="960" height="3020" viewBox="0 0 960 3020" role="img" aria-label="Haystack stop-rules in five beats. 1: an agent writes src/user.ts with a direct fetch, a swallowed error and a TODO stub. 2: the agent stops and the stop hook fires. 3: three rules come back broken, scores 0.96, 0.94 and 0.88. 4: time for each model type to answer the three questions, median of 5 calls: Jev, small model built for yes/no 0.522 s; GPT-6 Luna, no reasoning 1.665 s; GPT-6 Luna, reasoning low 2.053 s; GPT-6 Luna, reasoning medium 2.695 s. Then quality and cost per model type on 240 labelled changes. 5: the agent repairs the code and the check is clean."><title>Haystack stop-rules in five beats. 1: an agent writes src/user.ts with a direct fetch, a swallowed error and a TODO stub. 2: the agent stops and the stop hook fires. 3: three rules come back broken, scores 0.96, 0.94 and 0.88. 4: time for each model type to answer the three questions, median of 5 calls: Jev, small model built for yes/no 0.522 s; GPT-6 Luna, no reasoning 1.665 s; GPT-6 Luna, reasoning low 2.053 s; GPT-6 Luna, reasoning medium 2.695 s. Then quality and cost per model type on 240 labelled changes. 5: the agent repairs the code and the check is clean.</title><style>
