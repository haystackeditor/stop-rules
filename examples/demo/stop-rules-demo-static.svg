<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2382" viewBox="0 0 960 2382" role="img" aria-label="Haystack stop-rules in five beats. 1: an agent writes src/user.ts with a direct fetch, a swallowed error and a TODO stub. 2: the agent stops and the stop hook fires. 3: three rules come back broken, scores 0.96, 0.94 and 0.88. 4: Jev answers the three questions in 0.338 s, GPT-6 Luna in 1.039 s with no reasoning and 1.547 s with low reasoning, medians of 5 calls. 5: the agent repairs the code and the check is clean."><title>Haystack stop-rules in five beats. 1: an agent writes src/user.ts with a direct fetch, a swallowed error and a TODO stub. 2: the agent stops and the stop hook fires. 3: three rules come back broken, scores 0.96, 0.94 and 0.88. 4: Jev answers the three questions in 0.338 s, GPT-6 Luna in 1.039 s with no reasoning and 1.547 s with low reasoning, medians of 5 calls. 5: the agent repairs the code and the check is clean.</title><style>
.display{font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;letter-spacing:-0.02em}
.sans{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:400}
.strong{font-weight:600}
.mono{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;font-weight:500;font-variant-ligatures:none}
.label{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;font-weight:500;letter-spacing:0.17em;fill:#566079}
.ground{fill:#05080f}.panel{fill:#0c1220;stroke:#1a2540}
.ink{fill:#e9eef8}.muted{fill:#8592a9}.faint{fill:#566079}.cyan{fill:#58d7ff}.blue{fill:#4f8dff}
.fail{fill:#ff6a5d}.pass{fill:#46e0a0}.failbg{fill:#ff6a5d;fill-opacity:.12}.passbg{fill:#46e0a0;fill-opacity:.10}
.track{fill:#1a2540}.barfill{fill:#4f8dff}.barmuted{fill:#8592a9;fill-opacity:.55}.tick{stroke:#566079}
.box{fill:#0e1526;stroke:#26334e;stroke-width:1.5}.arrow{stroke:#8592a9;stroke-width:2.5}.arrowhead{fill:#8592a9}
.pill{fill:none;stroke:#1a2540}.pillon{fill:#4f8dff;fill-opacity:.14;stroke:#4f8dff}
</style><rect width="960" height="2382" rx="14" class="ground"/><g transform="translate(24 14) scale(0.6667)"><mask id="hss1" maskUnits="userSpaceOnUse" x="-64" y="-64" width="176" height="176"><circle cx="24.00" cy="15.41" r="9.50" fill="#fff"/><circle cx="33.04" cy="21.97" r="11.50" fill="#000"/></mask><circle cx="24.00" cy="15.41" r="9.50" fill="#DFE7F5" mask="url(#hss1)"/><mask id="hss2" maskUnits="userSpaceOnUse" x="-64" y="-64" width="176" height="176"><circle cx="33.04" cy="21.97" r="9.50" fill="#fff"/><circle cx="29.58" cy="32.59" r="11.50" fill="#000"/></mask><circle cx="33.04" cy="21.97" r="9.50" fill="#DFE7F5" mask="url(#hss2)"/><mask id="hss3" maskUnits="userSpaceOnUse" x="-64" y="-64" width="176" height="176"><circle cx="29.58" cy="32.59" r="9.50" fill="#fff"/><circle cx="18.42" cy="32.59" r="11.50" fill="#000"/></mask><circle cx="29.58" cy="32.59" r="9.50" fill="#DFE7F5" mask="url(#hss3)"/><mask id="hss4" maskUnits="userSpaceOnUse" x="-64" y="-64" width="176" height="176"><circle cx="18.42" cy="32.59" r="9.50" fill="#fff"/><circle cx="14.96" cy="21.97" r="11.50" fill="#000"/></mask><circle cx="18.42" cy="32.59" r="9.50" fill="#DFE7F5" mask="url(#hss4)"/><mask id="hss5" maskUnits="userSpaceOnUse" x="-64" y="-64" width="176" height="176"><circle cx="14.96" cy="21.97" r="9.50" fill="#fff"/><circle cx="24.00" cy="15.41" r="11.50" fill="#000"/></mask><circle cx="14.96" cy="21.97" r="9.50" fill="#3B82F6" mask="url(#hss5)"/></g><text x="66" y="38" class="display ink" font-size="22" xml:space="preserve">haystack</text><line x1="176" y1="20" x2="176" y2="42" class="tick"/><text x="192" y="37" class="label" font-size="14" xml:space="preserve">STOP-RULES DEMO</text><rect x="24" y="64" width="912" height="440" rx="12" class="panel"/><text x="52" y="108" class="mono cyan" font-size="18" xml:space="preserve">01</text><text x="90" y="109" class="display ink" font-size="27" xml:space="preserve">The agent writes code</text><g transform="translate(0 128)"><text x="52" y="34" class="label" font-size="14" xml:space="preserve">TASK</text><text x="116" y="34" class="mono ink" font-size="19" xml:space="preserve">Add loadUser and deleteUser to src/user.ts</text><g><text x="52" y="90" class="mono faint" font-size="18" xml:space="preserve"> 9</text><text x="96" y="90" class="mono ink" font-size="18" xml:space="preserve">export async function loadUser(id: string): Promise&lt;User | null&gt; {</text><text x="96" y="120" class="mono faint" font-size="18" xml:space="preserve">...</text><rect x="42" y="129" width="876" height="30" rx="4" class="failbg"/><text x="52" y="150" class="mono faint" font-size="18" xml:space="preserve">11</text><text x="96" y="150" class="mono fail" font-size="18" xml:space="preserve">    const response = await fetch(`${API}/users/${encodeURIComponent(id)}`);</text><text x="96" y="180" class="mono faint" font-size="18" xml:space="preserve">...</text><rect x="42" y="189" width="876" height="30" rx="4" class="failbg"/><text x="52" y="210" class="mono faint" font-size="18" xml:space="preserve">13</text><text x="96" y="210" class="mono fail" font-size="18" xml:space="preserve">  } catch {</text><rect x="42" y="219" width="876" height="30" rx="4" class="failbg"/><text x="52" y="240" class="mono faint" font-size="18" xml:space="preserve">14</text><text x="96" y="240" class="mono fail" font-size="18" xml:space="preserve">    return null;</text><text x="96" y="270" class="mono faint" font-size="18" xml:space="preserve">...</text><rect x="42" y="279" width="876" height="30" rx="4" class="failbg"/><text x="52" y="300" class="mono faint" font-size="18" xml:space="preserve">19</text><text x="96" y="300" class="mono fail" font-size="18" xml:space="preserve">  // TODO: call the API once the delete endpoint is ready</text><rect x="42" y="309" width="876" height="30" rx="4" class="failbg"/><text x="52" y="330" class="mono faint" font-size="18" xml:space="preserve">20</text><text x="96" y="330" class="mono fail" font-size="18" xml:space="preserve">  return true;</text></g></g><rect x="24" y="522" width="912" height="440" rx="12" class="panel"/><text x="52" y="566" class="mono cyan" font-size="18" xml:space="preserve">02</text><text x="90" y="567" class="display ink" font-size="27" xml:space="preserve">The agent stops, the stop hook fires</text><g transform="translate(0 586)"><g><rect x="50.0" y="70" width="240" height="96" rx="10" class="box"/><text x="170.0" y="112" class="display ink" font-size="23" text-anchor="middle" xml:space="preserve">the agent</text><text x="170.0" y="140" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">ends its turn</text></g><g><line x1="298.0" y1="118.0" x2="348.0" y2="118.0" class="arrow"/><path d="M348.0 111.0 L358.0 118.0 L348.0 125.0 Z" class="arrowhead"/><rect x="360.0" y="70" width="240" height="96" rx="10" class="box"/><text x="480.0" y="112" class="display ink" font-size="23" text-anchor="middle" xml:space="preserve">stop hook</text><text x="480.0" y="140" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">stop-rules</text></g><g><line x1="608.0" y1="118.0" x2="658.0" y2="118.0" class="arrow"/><path d="M658.0 111.0 L668.0 118.0 L658.0 125.0 Z" class="arrowhead"/><rect x="670.0" y="70" width="240" height="96" rx="10" class="box"/><text x="790.0" y="112" class="display ink" font-size="23" text-anchor="middle" xml:space="preserve">Jev</text><text x="790.0" y="140" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">3 yes or no questions</text></g><g><text x="170.0" y="236" class="sans strong cyan" font-size="21" text-anchor="middle" xml:space="preserve">1 changed piece</text><text x="170.0" y="266" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">src/user.ts lines 1-21</text></g><g><text x="480.0" y="236" class="sans strong cyan" font-size="21" text-anchor="middle" xml:space="preserve">3 rules</text><text x="480.0" y="266" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">from .stop-rules.md</text></g><g><text x="790.0" y="236" class="sans strong cyan" font-size="21" text-anchor="middle" xml:space="preserve">1 request</text><text x="790.0" y="266" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">one score per rule</text></g></g><rect x="24" y="980" width="912" height="440" rx="12" class="panel"/><text x="52" y="1024" class="mono cyan" font-size="18" xml:space="preserve">03</text><text x="90" y="1025" class="display ink" font-size="27" xml:space="preserve">3 rule violations come back</text><g transform="translate(0 1044)"><text x="52" y="40" class="mono fail" font-size="22" xml:space="preserve">src/user.ts</text><text x="224" y="40" class="mono muted" font-size="19" xml:space="preserve">lines 1-21</text><g><rect x="42" y="70" width="876" height="58" rx="8" class="failbg"/><text x="60" y="110" class="mono fail" font-size="30" xml:space="preserve">0.96</text><text x="162" y="108" class="sans strong ink" font-size="22" xml:space="preserve">No TODO stubs presented as finished</text></g><g><rect x="42" y="142" width="876" height="58" rx="8" class="failbg"/><text x="60" y="182" class="mono fail" font-size="30" xml:space="preserve">0.94</text><text x="162" y="180" class="sans strong ink" font-size="22" xml:space="preserve">Never call fetch directly, use httpGet</text></g><g><rect x="42" y="214" width="876" height="58" rx="8" class="failbg"/><text x="60" y="254" class="mono fail" font-size="30" xml:space="preserve">0.88</text><text x="162" y="252" class="sans strong ink" font-size="22" xml:space="preserve">Do not silently swallow errors</text></g><g><text x="52" y="320" class="sans muted" font-size="18" xml:space="preserve">0.6 or more counts as broken. The agent gets the full rule and the code.</text></g></g><rect x="24" y="1438" width="912" height="440" rx="12" class="panel"/><text x="52" y="1482" class="mono cyan" font-size="18" xml:space="preserve">04</text><text x="90" y="1483" class="display ink" font-size="27" xml:space="preserve">How fast each model answers</text><g transform="translate(0 1502)"><text x="52" y="34" class="sans ink" font-size="20" xml:space="preserve">3 yes or no questions about the same code: time to the answer</text><text x="52" y="106" class="sans strong ink" font-size="18" xml:space="preserve">Jev, small model built for yes/no</text><rect x="382" y="86" width="416.0" height="26" rx="4" class="track"/><rect x="382" y="86" width="88.0" height="26" rx="4" class="barfill "/><text x="481.95799999999997" y="107" class="mono blue" font-size="20" xml:space="preserve">0.338 s</text><text x="52" y="176" class="sans strong ink" font-size="18" xml:space="preserve">GPT-6 Luna, no reasoning</text><rect x="382" y="156" width="416.0" height="26" rx="4" class="track"/><rect x="382" y="156" width="270.1" height="26" rx="4" class="barmuted "/><text x="664.14" y="177" class="mono muted" font-size="20" xml:space="preserve">1.039 s</text><text x="52" y="246" class="sans strong ink" font-size="18" xml:space="preserve">GPT-6 Luna, reasoning low</text><rect x="382" y="226" width="416.0" height="26" rx="4" class="track"/><rect x="382" y="226" width="402.2" height="26" rx="4" class="barmuted "/><text x="796.22" y="247" class="mono muted" font-size="20" xml:space="preserve">1.547 s</text><text x="52" y="318" class="sans muted" font-size="18" xml:space="preserve">same code, same three rules, median of 5 calls each, 22 September 2026</text><text x="52" y="350" class="sans ink" font-size="18" xml:space="preserve">as a stop hook, including git and startup: 0.78 s</text></g><rect x="24" y="1896" width="912" height="440" rx="12" class="panel"/><text x="52" y="1940" class="mono cyan" font-size="18" xml:space="preserve">05</text><text x="90" y="1941" class="display ink" font-size="27" xml:space="preserve">The agent repairs the code</text><g transform="translate(0 1960)"><text x="52" y="34" class="label" font-size="14" xml:space="preserve">FIX</text><text x="116" y="34" class="mono ink" font-size="19" xml:space="preserve">use httpGet, rethrow the error, write deleteUser</text><rect x="42" y="69" width="876" height="30" rx="4" class="passbg"/><text x="52" y="90" class="mono faint" font-size="18" xml:space="preserve">13</text><text x="96" y="90" class="mono pass" font-size="18" xml:space="preserve">    return await httpGet&lt;User&gt;(`${API}/users/${encodeURIComponent(id)}`);</text><text x="96" y="120" class="mono faint" font-size="18" xml:space="preserve">...</text><rect x="42" y="129" width="876" height="30" rx="4" class="passbg"/><text x="52" y="150" class="mono faint" font-size="18" xml:space="preserve">15</text><text x="96" y="150" class="mono pass" font-size="18" xml:space="preserve">    if (error instanceof HttpError &amp;&amp; error.status === 404) return null;</text><rect x="42" y="159" width="876" height="30" rx="4" class="passbg"/><text x="52" y="180" class="mono faint" font-size="18" xml:space="preserve">16</text><text x="96" y="180" class="mono pass" font-size="18" xml:space="preserve">    throw error;</text><text x="96" y="210" class="mono faint" font-size="18" xml:space="preserve">...</text><rect x="42" y="219" width="876" height="30" rx="4" class="passbg"/><text x="52" y="240" class="mono faint" font-size="18" xml:space="preserve">21</text><text x="96" y="240" class="mono pass" font-size="18" xml:space="preserve">  await httpDelete(`${API}/users/${encodeURIComponent(id)}`);</text><g><text x="52" y="306" class="sans strong ink" font-size="20" xml:space="preserve">stop hook again:</text><text x="232" y="306" class="sans strong pass" font-size="22" xml:space="preserve">no rule violations</text><text x="52" y="338" class="sans muted" font-size="18" xml:space="preserve">scores 0.10, 0.07, 0.06, all under 0.6</text></g></g><text x="480.0" y="2366" class="sans muted" font-size="15" text-anchor="middle" xml:space="preserve">Real scores and timings, Jev jev-1.13.0 and GPT-6 Luna. The agent's two turns are scripted. See examples/demo/README.md.</text></svg>
