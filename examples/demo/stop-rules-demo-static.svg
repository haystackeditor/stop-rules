="34" class="label" font-size="14" xml:space="preserve">TASK</text><text x="116" y="34" class="mono ink" font-size="19" xml:space="preserve">Add loadUser and deleteUser to src/user.ts</text><g><text x="52" y="90" class="mono faint" font-size="18" xml:space="preserve"> 9</text><text x="96" y="90" class="mono ink" font-size="18" xml:space="preserve">export async function loadUser(id: string): Promise&lt;User | null&gt; {</text><text x="96" y="120" class="mono faint" font-size="18" xml:space="preserve">...</text><rect x="42" y="129" width="876" height="30" rx="4" class="failbg"/><text x="52" y="150" class="mono faint" font-size="18" xml:space="preserve">11</text><text x="96" y="150" class="mono fail" font-size="18" xml:space="preserve">    const response = await fetch(`${API}/users/${encodeURIComponent(id)}`);</text><text x="96" y="180" class="mono faint" font-size="18" xml:space="preserve">...</text><rect x="42" y="189" width="876" height="30" rx="4" class="failbg"/><text x="52" y="210" class="mono faint" font-size="18" xml:space="preserve">13</text><text x="96" y="210" class="mono fail" font-size="18" xml:space="preserve">  } catch {</text><rect x="42" y="219" width="876" height="30" rx="4" class="failbg"/><text x="52" y="240" class="mono faint" font-size="18" xml:space="preserve">14</text><text x="96" y="240" class="mono fail" font-size="18" xml:space="preserve">    return null;</text><text x="96" y="270" class="mono faint" font-size="18" xml:space="preserve">...</text><rect x="42" y="279" width="876" height="30" rx="4" class="failbg"/><text x="52" y="300" class="mono faint" font-size="18" xml:space="preserve">19</text><text x="96" y="300" class="mono fail" font-size="18" xml:space="preserve">  // TODO: call the API once the delete endpoint is ready</text><rect x="42" y="309" width="876" height="30" rx="4" class="failbg"/><text x="52" y="330" class="mono faint" font-size="18" xml:space="preserve">20</text><text x="96" y="330" class="mono fail" font-size="18" xml:space="preserve">  return true;</text></g></g><rect x="24" y="552" width="912" height="470" rx="12" class="panel"/><text x="52" y="596" class="mono cyan" font-size="18" xml:space="preserve">02</text><text x="90" y="597" class="display ink" font-size="27" xml:space="preserve">The agent stops, the stop hook fires</text><g transform="translate(0 616)"><g><rect x="50.0" y="70" width="240" height="96" rx="10" class="box"/><text x="170.0" y="112" class="display ink" font-size="23" text-anchor="middle" xml:space="preserve">the agent</text><text x="170.0" y="140" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">ends its turn</text></g><g><line x1="298.0" y1="118.0" x2="348.0" y2="118.0" class="arrow"/><path d="M348.0 111.0 L358.0 118.0 L348.0 125.0 Z" class="arrowhead"/><rect x="360.0" y="70" width="240" height="96" rx="10" class="box"/><text x="480.0" y="112" class="display ink" font-size="23" text-anchor="middle" xml:space="preserve">stop hook</text><text x="480.0" y="140" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">stop-rules</text></g><g><line x1="608.0" y1="118.0" x2="658.0" y2="118.0" class="arrow"/><path d="M658.0 111.0 L668.0 118.0 L658.0 125.0 Z" class="arrowhead"/><rect x="670.0" y="70" width="240" height="96" rx="10" class="box"/><text x="790.0" y="112" class="display ink" font-size="23" text-anchor="middle" xml:space="preserve">Jev</text><text x="790.0" y="140" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">3 yes or no questions</text></g><g><text x="170.0" y="236" class="sans strong cyan" font-size="21" text-anchor="middle" xml:space="preserve">1 changed piece</text><text x="170.0" y="266" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">src/user.ts lines 1-21</text></g><g><text x="480.0" y="236" class="sans strong cyan" font-size="21" text-anchor="middle" xml:space="preserve">3 rules</text><text x="480.0" y="266" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">from .stop-rules.md</text></g><g><text x="790.0" y="236" class="sans strong cyan" font-size="21" text-anchor="middle" xml:space="preserve">1 request</text><text x="790.0" y="266" class="sans muted" font-size="17" text-anchor="middle" xml:space="preserve">one score per rule</text></g></g><rect x="24" y="1040" width="912" height="470" rx="12" class="panel"/><text x="52" y="1084" class="mono cyan" font-size="18" xml:space="preserve">03</text><text x="90" y="1085" class="display ink" font-size="27" xml:space="preserve">3 rule violations come back</text><g transform="translate(0 1104)"><text x="52" y="40" class="mono fail" font-size="22" xml:space="preserve">src/user.ts</text><text x="224" y="40" class="mono muted" font-size="19" xml:space="preserve">lines 1-21</text><g><rect x="42" y="70" width="876" height="58" rx="8" class="failbg"/><text x="60" y="110" class="mono fail" font-size="30" xml:space="preserve">0.96</text><text x="162" y="108" class="sans strong ink" font-size="22" xml:space="preserve">No TODO stubs presented as finished</text></g><g><rect x="42" y="142" width="876" height="58" rx="8" class="failbg"/><text x="60" y="182" class="mono fail" font-size="30" xml:space="preserve">0.94</text><text x="162" y="180" class="sans strong ink" font-size="22" xml:space="preserve">Never call fetch directly, use httpGet</text></g><g><rect x="42" y="214" width="876" height="58" rx="8" class="failbg"/><text x="60" y="254" class="mono fail" font-size="30" xml:space="preserve">0.88</text><text x="162" y="252" class="sans strong ink" font-size="22" xml:space="preserve">Do not silently swallow errors</text></g><g><text x="52" y="320" class="sans muted" font-size="18" xml:space="preserve">0.6 or more counts as broken. The agent gets the full rule and the code.</text></g></g><rect x="24" y="1528" width="912" height="470" rx="12" class="panel"/><text x="52" y="1572" class="mono cyan" font-size="18" xml:space="preserve">04</text><text x="90" y=