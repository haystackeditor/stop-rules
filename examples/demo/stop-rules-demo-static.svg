<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2338" viewBox="0 0 960 2338" role="img" aria-label="stop-rules in five beats. 1: an agent writes src/user.ts with a direct fetch, a swallowed error and a TODO stub. 2: the agent stops and the stop hook fires. 3: three rules come back broken, scores 0.96, 0.94 and 0.88. 4: that took 0.533 s, the median of 5 measured runs. 5: the agent repairs the code and the check is clean."><title>stop-rules in five beats. 1: an agent writes src/user.ts with a direct fetch, a swallowed error and a TODO stub. 2: the agent stops and the stop hook fires. 3: three rules come back broken, scores 0.96, 0.94 and 0.88. 4: that took 0.533 s, the median of 5 measured runs. 5: the agent repairs the code and the check is clean.</title><style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.card{fill:#f6f8fa}.panel{fill:#ffffff;stroke:#d1d9e0}
.fg{fill:#1f2328}.muted{fill:#59636e}.bad{fill:#cf222e}.good{fill:#1a7f37}.accent{fill:#0969da}
.badbg{fill:#ffebe9}.goodbg{fill:#dafbe1}.track{fill:#e6eaef}.barfill{fill:#cf222e}
.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}.arrow{stroke:#59636e;stroke-width:2.5}.arrowhead{fill:#59636e}
.tick{stroke:#59636e}.pill{fill:none;stroke:#d1d9e0}.pillon{fill:#0969da}.pilltxt{fill:#59636e}.pillontxt{fill:#ffffff}
@media (prefers-color-scheme:dark){
.card{fill:#0d1117}.panel{fill:#161b22;stroke:#3d444d}
.fg{fill:#e6edf3}.muted{fill:#9198a1}.bad{fill:#ff7b72}.good{fill:#3fb950}.accent{fill:#58a6ff}
.badbg{fill:#3c1618}.goodbg{fill:#12261e}.track{fill:#2a313a}.barfill{fill:#ff7b72}
.box{fill:#0d1117;stroke:#6e7681}.arrow{stroke:#9198a1}.arrowhead{fill:#9198a1}
.tick{stroke:#9198a1}.pill{stroke:#3d444d}.pillon{fill:#1f6feb}.pilltxt{fill:#9198a1}.pillontxt{fill:#ffffff}
}
</style><rect width="960" height="2338" rx="12" class="card"/><rect x="24" y="18" width="912" height="440" rx="10" class="panel"/><text x="52" y="62" class="fg sans" font-size="26" font-weight="700" xml:space="preserve">1.  The agent writes code</text><g transform="translate(0 82)"><text x="52" y="34" class="muted mono" font-size="18" xml:space="preserve">task</text><text x="116" y="34" class="fg mono" font-size="20" font-weight="600" xml:space="preserve">Add loadUser and deleteUser to src/user.ts</text><g><text x="52" y="90" class="muted mono" font-size="18" xml:space="preserve"> 9</text><text x="96" y="90" class="fg mono" font-size="18" xml:space="preserve">export async function loadUser(id: string): Promise&lt;User | null&gt; {</text><text x="96" y="120" class="muted mono" font-size="18" xml:space="preserve">...</text><rect x="42" y="129" width="876" height="30" rx="4" class="badbg"/><text x="52" y="150" class="muted mono" font-size="18" xml:space="preserve">11</text><text x="96" y="150" class="bad mono" font-size="18" xml:space="preserve">    const response = await fetch(`${API}/users/${encodeURIComponent(id)}`);</text><text x="96" y="180" class="muted mono" font-size="18" xml:space="preserve">...</text><rect x="42" y="189" width="876" height="30" rx="4" class="badbg"/><text x="52" y="210" class="muted mono" font-size="18" xml:space="preserve">13</text><text x="96" y="210" class="bad mono" font-size="18" xml:space="preserve">  } catch {</text><rect x="42" y="219" width="876" height="30" rx="4" class="badbg"/><text x="52" y="240" class="muted mono" font-size="18" xml:space="preserve">14</text><text x="96" y="240" class="bad mono" font-size="18" xml:space="preserve">    return null;</text><text x="96" y="270" class="muted mono" font-size="18" xml:space="preserve">...</text><rect x="42" y="279" width="876" height="30" rx="4" class="badbg"/><text x="52" y="300" class="muted mono" font-size="18" xml:space="preserve">19</text><text x="96" y="300" class="bad mono" font-size="18" xml:space="preserve">  // TODO: call the API once the delete endpoint is ready</text><rect x="42" y="309" width="876" height="30" rx="4" class="badbg"/><text x="52" y="330" class="muted mono" font-size="18" xml:space="preserve">20</text><text x="96" y="330" class="bad mono" font-size="18" xml:space="preserve">  return true;</text></g></g><rect x="24" y="476" width="912" height="440" rx="10" class="panel"/><text x="52" y="520" class="fg sans" font-size="26" font-weight="700" xml:space="preserve">2.  The agent stops, the stop hook fires</text><g transform="translate(0 540)"><g><rect x="50.0" y="70" width="240" height="96" rx="10" class="box"/><text x="170.0" y="110" class="fg sans" font-size="22" text-anchor="middle" font-weight="600" xml:space="preserve">the agent</text><text x="170.0" y="140" class="muted sans" font-size="18" text-anchor="middle" xml:space="preserve">ends its turn</text></g><g><line x1="298.0" y1="118.0" x2="348.0" y2="118.0" class="arrow"/><path d="M348.0 111.0 L358.0 118.0 L348.0 125.0 Z" class="arrowhead"/><rect x="360.0" y="70" width="240" height="96" rx="10" class="box"/><text x="480.0" y="110" class="fg sans" font-size="22" text-anchor="middle" font-weight="600" xml:space="preserve">stop hook</text><text x="480.0" y="140" class="muted sans" font-size="18" text-anchor="middle" xml:space="preserve">stop-rules</text></g><g><line x1="608.0" y1="118.0" x2="658.0" y2="118.0" class="arrow"/><path d="M658.0 111.0 L668.0 118.0 L658.0 125.0 Z" class="arrowhead"/><rect x="670.0" y="70" width="240" height="96" rx="10" class="box"/><text x="790.0" y="110" class="fg sans" font-size="22" text-anchor="middle" font-weight="600" xml:space="preserve">Jev</text><text x="790.0" y="140" class="muted sans" font-size="18" text-anchor="middle" xml:space="preserve">3 yes or no questions</text></g><g><text x="170.0" y="236" class="accent sans" font-size="22" text-anchor="middle" font-weight="600" xml:space="preserve">1 changed piece</text><text x="170.0" y="266" class="muted sans" font-size="17" text-anchor="middle" xml:space="preserve">src/user.ts lines 1-21</text></g><g><text x="480.0" y="236" class="accent sans" font-size="22" text-anchor="middle" font-weight="600" xml:space="preserve">3 rules</text><text x="480.0" y="266" class="muted sans" font-size="17" text-anchor="middle" xml:space="preserve">from .stop-rules.md</text></g><g><text x="790.0" y="236" class="accent sans" font-size="22" text-anchor="middle" font-weight="600" xml:space="preserve">1 request</text><text x="790.0" y="266" class="muted sans" font-size="17" text-anchor="middle" xml:space="preserve">one score per rule</text></g></g><rect x="24" y="934" width="912" height="440" rx="10" class="panel"/><text x="52" y="978" class="fg sans" font-size="26" font-weight="700" xml:space="preserve">3.  3 rule violations come back</text><g transform="translate(0 998)"><text x="52" y="40" class="bad mono" font-size="22" font-weight="700" xml:space="preserve">src/user.ts</text><text x="204" y="40" class="muted mono" font-size="20" xml:space="preserve">lines 1-21</text><g><rect x="42" y="70" width="876" height="58" rx="8" class="badbg"/><text x="60" y="110" class="bad mono" font-size="30" font-weight="700" xml:space="preserve">0.96</text><text x="162" y="108" class="fg sans" font-size="22" font-weight="600" xml:space="preserve">No TODO stubs presented as finished</text></g><g><rect x="42" y="142" width="876" height="58" rx="8" class="badbg"/><text x="60" y="182" class="bad mono" font-size="30" font-weight="700" xml:space="preserve">0.94</text><text x="162" y="180" class="fg sans" font-size="22" font-weight="600" xml:space="preserve">Never call fetch directly, use httpGet</text></g><g><rect x="42" y="214" width="876" height="58" rx="8" class="badbg"/><text x="60" y="254" class="bad mono" font-size="30" font-weight="700" xml:space="preserve">0.88</text><text x="162" y="252" class="fg sans" font-size="22" font-weight="600" xml:space="preserve">Do not silently swallow errors</text></g><g><text x="52" y="320" class="muted sans" font-size="18" xml:space="preserve">0.6 or more counts as broken. The agent gets the full rule and the code.</text></g></g><rect x="24" y="1392" width="912" height="440" rx="10" class="panel"/><text x="52" y="1436" class="fg sans" font-size="26" font-weight="700" xml:space="preserve">4.  How long that took</text><g transform="translate(0 1456)"><text x="52" y="40" class="fg sans" font-size="20" xml:space="preserve">from the agent stopping to the 3 findings being back</text><rect x="52" y="100" width="856" height="18" rx="4" class="track"/><rect x="52" y="100" width="456.2" height="18" rx="4" class="barfill "/><line x1="52.0" y1="124" x2="52.0" y2="132" class="tick"/><text x="52" y="154" class="muted sans" font-size="17" text-anchor="start" xml:space="preserve">0 s</text><line x1="480.0" y1="124" x2="480.0" y2="132" class="tick"/><text x="480.0" y="154" class="muted sans" font-size="17" text-anchor="middle" xml:space="preserve">0.5 s</text><line x1="908.0" y1="124" x2="908.0" y2="132" class="tick"/><text x="908.0" y="154" class="muted sans" font-size="17" text-anchor="end" xml:space="preserve">1 s</text><text x="52" y="250" class="accent mono" font-size="76" font-weight="700" xml:space="preserve">0.533 s</text><text x="442" y="216" class="fg sans" font-size="20" font-weight="600" xml:space="preserve">measured, median of 5 runs</text><text x="442" y="244" class="muted sans" font-size="18" xml:space="preserve">each run one real Jev call</text><text x="52" y="320" class="muted sans" font-size="18" xml:space="preserve">runs: 0.490, 0.499, 0.533, 0.540, 0.605 s</text><text x="52" y="350" class="muted sans" font-size="18" xml:space="preserve">Jev version jev-1.13.0, 22 September 2026</text></g><rect x="24" y="1850" width="912" height="440" rx="10" class="panel"/><text x="52" y="1894" class="fg sans" font-size="26" font-weight="700" xml:space="preserve">5.  The agent repairs the code</text><g transform="translate(0 1914)"><text x="52" y="34" class="muted mono" font-size="18" xml:space="preserve">fix</text><text x="116" y="34" class="fg mono" font-size="20" font-weight="600" xml:space="preserve">use httpGet, rethrow the error, write deleteUser</text><rect x="42" y="69" width="876" height="30" rx="4" class="goodbg"/><text x="52" y="90" class="muted mono" font-size="18" xml:space="preserve">13</text><text x="96" y="90" class="good mono" font-size="18" xml:space="preserve">    return await httpGet&lt;User&gt;(`${API}/users/${encodeURIComponent(id)}`);</text><text x="96" y="120" class="muted mono" font-size="18" xml:space="preserve">...</text><rect x="42" y="129" width="876" height="30" rx="4" class="goodbg"/><text x="52" y="150" class="muted mono" font-size="18" xml:space="preserve">15</text><text x="96" y="150" class="good mono" font-size="18" xml:space="preserve">    if (error instanceof HttpError &amp;&amp; error.status === 404) return null;</text><rect x="42" y="159" width="876" height="30" rx="4" class="goodbg"/><text x="52" y="180" class="muted mono" font-size="18" xml:space="preserve">16</text><text x="96" y="180" class="good mono" font-size="18" xml:space="preserve">    throw error;</text><text x="96" y="210" class="muted mono" font-size="18" xml:space="preserve">...</text><rect x="42" y="219" width="876" height="30" rx="4" class="goodbg"/><text x="52" y="240" class="muted mono" font-size="18" xml:space="preserve">21</text><text x="96" y="240" class="good mono" font-size="18" xml:space="preserve">  await httpDelete(`${API}/users/${encodeURIComponent(id)}`);</text><g><text x="52" y="306" class="fg sans" font-size="20" font-weight="600" xml:space="preserve">stop hook again:</text><text x="228" y="306" class="good sans" font-size="22" font-weight="700" xml:space="preserve">no rule violations</text><text x="52" y="338" class="muted sans" font-size="18" xml:space="preserve">scores 0.10, 0.07, 0.06, all under 0.6</text></g></g><text x="480.0" y="2322" class="muted sans" font-size="16" text-anchor="middle" xml:space="preserve">Real scores and timings from Jev (jev-1.13.0). The agent's two turns are scripted. See examples/demo/README.md.</text></svg>
