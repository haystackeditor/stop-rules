services:
  - type: web
    name: stop-rules
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: STOP_RULES_CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: STOP_RULES_CLOUDFLARE_API_TOKEN
        sync: false
      - key: STOP_RULES_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
