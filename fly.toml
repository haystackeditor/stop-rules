# fly launch rewrites app and primary_region for your own account and nearest region.
app = "stop-rules"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/health"
  grace_period = "10s"
  interval = "30s"
  timeout = "5s"
